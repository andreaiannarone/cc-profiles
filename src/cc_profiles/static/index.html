<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel-2: #f0eee9; --line: #e2dfd8;
  --text: #1d1c1a; --muted: #6e6a62; --faint: #9b968c;
  --accent: #c2410c; --accent-soft: #fbe9df; --on-accent: #ffffff;
  /* profile palette, assigned in config order; "shared" has its own color */
  --p0: #047857; --p0-soft: #ddf3ea; --p1: #1d4ed8; --p1-soft: #e3ebfd; --p2: #be185d; --p2-soft: #fbe2ee;
  --p3: #0f766e; --p3-soft: #d5f2ee; --p4: #4338ca; --p4-soft: #e5e6fb; --p5: #854d0e; --p5-soft: #fbf0d4;
  --shared: #6d28d9; --shared-soft: #ede5fb;
  --ok: #15803d; --warn: #b45309; --warn-soft: #fdf1dc; --err: #b91c1c; --err-soft: #fbe3e3;
  --logo: #d97757; --logo-back: #e9a98c; --logo-eye: #1d1c1a;
  --radius: 10px; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --panel: #1f1e1b; --panel-2: #282723; --line: #353330;
    --text: #ecebe7; --muted: #a29e95; --faint: #75716a;
    --accent: #fb8a4c; --accent-soft: #3a2418; --on-accent: #1d1c1a;
    --p0: #5fd3a6; --p0-soft: #15332a; --p1: #8fb0ff; --p1-soft: #1c2742; --p2: #f9a8d4; --p2-soft: #3d1a2c;
    --p3: #5eead4; --p3-soft: #123430; --p4: #a5b4fc; --p4-soft: #1f2147; --p5: #fcd34d; --p5-soft: #362a0c;
    --shared: #c4a5ff; --shared-soft: #2a2140;
    --ok: #4ade80; --warn: #fbbf24; --warn-soft: #3a2c10; --err: #f87171; --err-soft: #3d1a1a;
    --logo-back: #8a4a33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #1f1e1b; --panel-2: #282723; --line: #353330;
  --text: #ecebe7; --muted: #a29e95; --faint: #75716a;
  --accent: #fb8a4c; --accent-soft: #3a2418; --on-accent: #1d1c1a;
  --p0: #5fd3a6; --p0-soft: #15332a; --p1: #8fb0ff; --p1-soft: #1c2742; --p2: #f9a8d4; --p2-soft: #3d1a2c;
  --p3: #5eead4; --p3-soft: #123430; --p4: #a5b4fc; --p4-soft: #1f2147; --p5: #fcd34d; --p5-soft: #362a0c;
  --shared: #c4a5ff; --shared-soft: #2a2140;
  --ok: #4ade80; --warn: #fbbf24; --warn-soft: #3a2c10; --err: #f87171; --err-soft: #3d1a1a;
  --logo-back: #8a4a33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { padding: 24px 28px 80px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.logo { width: 45px; height: 30px; flex: none; }
.lg-front { fill: var(--logo); } .lg-back { fill: var(--logo-back); } .lg-eye { fill: var(--logo-eye); }
header .sub { color: var(--muted); }
.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.pcard .top { display: flex; align-items: center; gap: 8px; }
.pcard .name { font-weight: 650; font-size: 15px; }
.pcard .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.pcard .acct, .prow .acct { font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.pcard .acct.none, .prow .acct.none { color: var(--muted); }
.ext-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 22px 0 8px; }
.ext-head h3 { margin: 0; font-size: 15px; }
.ext-head .hint { flex: 1; min-width: 200px; }
.cards.skgrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.mcp-target { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.pcard .nums { display: flex; gap: 16px; margin-top: 10px; }
.pcard .nums b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.pcard .nums span { color: var(--muted); font-size: 12px; }
.live { font-size: 11.5px; color: var(--warn); background: var(--warn-soft); padding: 1px 7px; border-radius: 99px; margin-left: auto; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
nav.tabs button { background: none; border: 0; padding: 9px 14px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
nav.tabs .count { font-size: 11px; background: var(--err-soft); color: var(--err); border-radius: 99px; padding: 0 6px; margin-left: 4px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
input.search, input.text, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input.search { min-width: 240px; margin-left: auto; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--err); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }

.table { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 550; font-size: 12px; color: var(--muted); padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.path { word-break: break-all; }
td.nums { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
td.acts { text-align: right; white-space: nowrap; }
td.acts .btn + .btn { margin-left: 6px; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.b-p0 { background: var(--p0-soft); color: var(--p0); } .b-p1 { background: var(--p1-soft); color: var(--p1); }
.b-p2 { background: var(--p2-soft); color: var(--p2); } .b-p3 { background: var(--p3-soft); color: var(--p3); }
.b-p4 { background: var(--p4-soft); color: var(--p4); } .b-p5 { background: var(--p5-soft); color: var(--p5); }
.b-shared { background: var(--shared-soft); color: var(--shared); }
.b-none { background: var(--panel-2); color: var(--muted); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-err { background: var(--err-soft); color: var(--err); }
.issue { font-size: 12.5px; color: var(--warn); }
.issue.err { color: var(--err); }
.okmark { color: var(--ok); font-size: 12.5px; }
.empty { padding: 36px; text-align: center; color: var(--muted); }

.memgrid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.side .head { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel); padding: 6px; cursor: pointer; }
.seg button.on { background: var(--text); color: var(--bg); }
.plist { max-height: 62vh; overflow: auto; }
.plist button { display: flex; width: 100%; text-align: left; gap: 8px; border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); align-items: baseline; }
.plist button:hover { background: var(--panel-2); }
.plist button.on { background: var(--accent-soft); }
.plist .p { flex: 1; word-break: break-all; font-family: var(--mono); font-size: 12px; }
.plist .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
label.check { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.cards { display: grid; gap: 10px; }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.mcard:hover { border-color: var(--faint); }
.mcard.on { border-color: var(--accent); }
.mcard .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.mcard .d { color: var(--muted); font-size: 13px; margin-top: 3px; }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 12px; }
.editor textarea { width: 100%; min-height: 340px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; resize: vertical; }
.editor .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.editor .row .grow { flex: 1; color: var(--muted); font-size: 12px; }
.hint { color: var(--muted); font-size: 12.5px; }

.health { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.hcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.hcard h3 { margin: 0 0 10px; font-size: 15px; }
.hcard h4 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.check { display: flex; gap: 8px; padding: 3px 0; font-size: 13px; }
.check .i { width: 16px; flex: none; text-align: center; }
.check.ok .i { color: var(--ok); } .check.warn .i { color: var(--warn); } .check.error .i { color: var(--err); }
.orphan { border-top: 1px solid var(--line); padding: 9px 0; }
.orphan .p { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.orphan .c { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px; z-index: 10; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal h2 { margin: 0 0 4px; font-size: 16px; }
.modal .body { margin: 12px 0 16px; display: grid; gap: 10px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; }
.modal .opt { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: background .15s; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--panel); border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(16px); }
.switch input:disabled + span { opacity: .5; cursor: default; }
.share { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.share .txt { flex: 1; }
.share .txt b { font-weight: 600; font-family: var(--mono); font-size: 12.5px; }
.share .txt div { color: var(--muted); font-size: 12.5px; }
.pcard.add { display: flex; align-items: center; justify-content: center; border-style: dashed; cursor: pointer; color: var(--muted); font-weight: 550; min-height: 110px; background: transparent; }
.pcard.add:hover { color: var(--text); border-color: var(--faint); }
.form { display: grid; gap: 12px; }
.form label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.form .radio { display: grid; gap: 6px; }
.form .radio label, .form .checks label { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 13.5px; }
.form .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.prow { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .txt { flex: 1; min-width: 0; }
.prow .t { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.prow .m { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.prow .acts { display: flex; gap: 6px; flex: none; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; }
.plan { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); max-height: 220px; overflow-y: auto; }
.plan li { margin: 2px 0; overflow-wrap: anywhere; }
.plan li.conflict { color: var(--warn); }
.danger-box { border: 1px solid var(--err); background: var(--err-soft); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.setgrid { display: grid; gap: 16px; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.sec > .h { display: flex; gap: 10px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sec > .h h3 { margin: 0; font-size: 15px; }
.sec > .h .hint { flex: 1; }
.sec > .b { padding: 12px 16px; }
.srow { display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(200px, 1.3fr) minmax(160px, 1fr); gap: 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .l b { display: block; font-weight: 600; }
.srow .l span { color: var(--muted); font-size: 12.5px; }
.srow .v { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.srow .v .sdesc { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
.srow .v .sdesc:empty { display: none; }
.srow .v input.text { flex: 1; min-width: 0; }
.srow .v .src { font-size: 11.5px; }
.srow .o { font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.srow .o div { display: flex; gap: 6px; align-items: center; }
.srow .o code { color: var(--text); }
textarea.code { width: 100%; min-height: 260px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; resize: vertical; }
.perm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.perm label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.perm textarea { min-height: 150px; font-family: var(--mono); font-size: 12px; }
.row-end { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; }
.row-end .grow { flex: 1; color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.shared-note { font-size: 12px; color: var(--shared); background: var(--shared-soft); border-radius: 99px; padding: 1px 8px; }
@media (max-width: 820px) { .srow { grid-template-columns: 1fr; } .perm { grid-template-columns: 1fr; } }
.iconbtn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel); border-radius: 50%; cursor: pointer; color: var(--muted); align-self: center; }
#theme-btn { margin-left: auto; }
.iconbtn:hover { color: var(--text); border-color: var(--faint); }
.popover { position: fixed; z-index: 15; width: 260px; display: grid; gap: 8px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.popover h2 { margin: 0 0 2px; font-size: 15px; }
.popover .seg button { padding: 6px 4px; }
.iconbtn svg { width: 18px; height: 18px; }
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(0,0,0,.2); overflow-y: auto; z-index: 16; }
.drawer .dh { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 1; }
.drawer .dh h2 { margin: 0; font-size: 16px; flex: 1; }
.drawer .db { padding: 16px 20px 40px; display: grid; gap: 14px; }
.drawer .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.drawer .card h3 { margin: 0 0 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.drawer .card h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.drawer .kv { grid-template-columns: minmax(150px, max-content) 1fr; }
.drawer .kv dd { word-break: break-all; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--mono); font-size: 11.5px; background: var(--panel-2); border-radius: 6px; padding: 1px 6px; }
.citem { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
.citem:first-of-type { border-top: 0; }
.citem .k { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slidein .18s ease-out; } @keyframes slidein { from { transform: translateX(30px); opacity: 0; } } }
.notice { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--radius); margin-bottom: 16px; border: 1px solid var(--warn); background: var(--warn-soft); }
.notice .txt { flex: 1; }
.notice .txt b { display: block; }
.notice .txt span { color: var(--muted); font-size: 13px; }
.method { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.method:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.method.off { opacity: .55; cursor: default; }
.method .top { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.method code { font-size: 12px; word-break: break-all; }
pre.log { background: #141311; color: #e8e6e1; border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.5; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
.bk { display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.bk:last-child { border-bottom: 0; }
.bk .txt { flex: 1; min-width: 0; }
.bk .t { font-weight: 600; }
.bk .m { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.bk .acts { display: flex; gap: 6px; flex: none; }
.toasts { position: fixed; bottom: 18px; right: 18px; display: grid; gap: 8px; z-index: 20; max-width: min(440px, calc(100vw - 36px)); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.toast.err { background: var(--err); color: #fff; }
.toast small { display: block; opacity: .75; margin-top: 2px; font-family: var(--mono); font-size: 11px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 820px) {
  .wrap { padding: 20px 16px 60px; }
  .memgrid { grid-template-columns: 1fr; }
  input.search { margin-left: 0; min-width: 0; width: 100%; }
  .table { overflow-x: auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><svg class="logo" viewBox="0 0 126 84" aria-hidden="true" shape-rendering="crispEdges"><rect class="lg-back" x="84" y="0" width="7" height="7"/><rect class="lg-back" x="77" y="7" width="7" height="7"/><rect class="lg-back" x="56" y="14" width="56" height="7"/><rect class="lg-back" x="77" y="21" width="42" height="7"/><rect class="lg-back" x="84" y="28" width="14" height="7"/><rect class="lg-back" x="105" y="28" width="14" height="7"/><rect class="lg-back" x="84" y="35" width="14" height="7"/><rect class="lg-back" x="105" y="35" width="14" height="7"/><rect class="lg-back" x="84" y="42" width="35" height="7"/><rect class="lg-back" x="84" y="49" width="35" height="7"/><rect class="lg-back" x="84" y="56" width="35" height="7"/><rect class="lg-back" x="98" y="63" width="14" height="7"/><rect class="lg-front" x="42" y="14" width="7" height="7"/><rect class="lg-front" x="35" y="21" width="7" height="7"/><rect class="lg-front" x="14" y="28" width="56" height="7"/><rect class="lg-front" x="7" y="35" width="70" height="7"/><rect class="lg-front" x="7" y="42" width="14" height="7"/><rect class="lg-front" x="28" y="42" width="28" height="7"/><rect class="lg-front" x="63" y="42" width="14" height="7"/><rect class="lg-front" x="7" y="49" width="14" height="7"/><rect class="lg-front" x="28" y="49" width="28" height="7"/><rect class="lg-front" x="63" y="49" width="14" height="7"/><rect class="lg-front" x="7" y="56" width="70" height="7"/><rect class="lg-front" x="7" y="63" width="70" height="7"/><rect class="lg-front" x="7" y="70" width="70" height="7"/><rect class="lg-front" x="14" y="77" width="14" height="7"/><rect class="lg-front" x="56" y="77" width="14" height="7"/><rect class="lg-eye" x="98" y="28" width="7" height="7"/><rect class="lg-eye" x="98" y="35" width="7" height="7"/><rect class="lg-eye" x="21" y="42" width="7" height="7"/><rect class="lg-eye" x="56" y="42" width="7" height="7"/><rect class="lg-eye" x="21" y="49" width="7" height="7"/><rect class="lg-eye" x="56" y="49" width="7" height="7"/></svg>cc-profiles</h1><span class="sub">profiles, projects and memories for Claude Code</span>
    <button class="iconbtn" id="theme-btn" title="Theme" aria-label="Theme" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
    <button class="iconbtn" id="about-btn" title="About Claude Code on this computer" aria-label="About Claude Code on this computer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    </button></header>
  <div id="notice"></div>
  <section class="profiles" id="profiles"></section>
  <nav class="tabs" id="tabs">
    <button data-tab="projects" class="on">Projects <span class="count" id="cnt-projects" hidden></span></button>
    <button data-tab="memories">Memories</button>
    <button data-tab="profiles">Profiles</button>
    <button data-tab="skills">Skills</button>
    <button data-tab="mcp">MCP</button>
    <button data-tab="backups">Backups</button>
    <button data-tab="health">Health <span class="count" id="cnt-health" hidden></span></button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
const TOKEN = "__TOKEN__";
const S = { tab: "projects", profiles: [], projects: [], filter: "issues", q: "",
            mem: { profile: null, project: null, all: false, q: "", list: null, file: null, projects: [] },
            health: null, ext: { profile: null, skills: null, mcp: null, error: null, skill: null, content: "", files: [], q: "" } };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const label = id => id === "shared" ? "All profiles" : (S.profiles.find(p => p.id === id)?.label || id);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function badge(id) {
  if (!id) return `<span class="badge b-none">unassigned</span>`;
  if (id === "shared") return `<span class="badge b-shared">All profiles</span>`;
  const i = S.profiles.findIndex(p => p.id === id);
  return `<span class="badge ${i < 0 ? "b-none" : "b-p" + (i % 6)}">${esc(label(id))}</span>`;
}
const basename = p => (p || "").replace(/\/+$/, "").split("/").pop();

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET",
    headers: { "X-Token": TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: "Invalid response from the server" }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, sub, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.setAttribute("role", err ? "alert" : "status");
  t.innerHTML = esc(msg) + (sub ? `<small>${esc(sub)}</small>` : "");
  $("#toasts").append(t);
  setTimeout(() => t.remove(), err ? 9000 : 6000);
}
async function run(fn) {
  try { const r = await fn(); if (r?.message) toast(r.message, r.backup ? "backup: " + r.backup : ""); return r; }
  catch (e) { toast(e.message, "", true); throw e; }
}

// ---------- modal ----------
function modal({ title, sub, body = "", actions = [] }) {
  return new Promise(resolve => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${sub ? `<div class="hint">${sub}</div>` : ""}
      <div class="body">${body}</div>
      <div class="foot">${actions.map((a, i) => a.label ? `<button class="btn ${a.kind || ""}" data-i="${i}">${esc(a.label)}</button>` : "").join("")}
        <button class="btn" data-close>Cancel</button></div></div>`;
    const close = v => { bg.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = e => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", onKey);
    bg.addEventListener("click", e => {
      if (e.target === bg || e.target.hasAttribute("data-close")) return close(null);
      const i = e.target.closest("[data-i]")?.dataset.i;
      if (i !== undefined) close({ action: actions[i].value, el: bg });
      const pick = e.target.closest("[data-pick]");
      if (pick) { const inp = $("input.text", bg); if (inp) { inp.value = pick.dataset.pick; inp.focus(); } }
    });
    document.body.append(bg);
    ($("input, select", bg) || $("[data-i]", bg))?.focus();
  });
}
async function confirmBox(title, sub, okLabel = "Confirm", kind = "primary") {
  const r = await modal({ title, sub, actions: [{ label: okLabel, kind, value: true }] });
  return !!r;
}

// ---------- data ----------
async function loadProfiles() {
  S.profiles = await api("/api/profiles");
  $("#profiles").innerHTML = S.profiles.map(p => `
    <div class="pcard">
      <div class="top"><span class="name">${esc(p.label)}</span>${badge(p.id)}
        ${p.active ? `<span class="live" title="A conversation was written in the last 2 minutes">session open</span>` : ""}</div>
      <div class="acct${p.email ? "" : " none"}">${p.email ? `Signed in as <b>${esc(p.email)}</b>` : "Not signed in"}</div>
      <div class="meta"><code>${esc(p.command)}</code> · <code>${esc(p.dir)}</code></div>
      <div class="nums"><div><b>${p.conv}</b><span>conversations</span></div>
        <div><b>${p.projects}</b><span>projects</span></div><div><b>${p.memories}</b><span>memories</span></div></div>
    </div>`).join("") + `<button class="pcard add" data-newprofile>+ New profile</button>`;
}
async function loadProjects() {
  S.projects = await api("/api/projects");
  const n = S.projects.filter(r => r.issues.length).length;
  const c = $("#cnt-projects"); c.hidden = !n; c.textContent = n;
}
async function refresh() { await Promise.all([loadProfiles(), loadProjects()]); render(); }

// ---------- projects ----------
function filtered() {
  const q = S.q.toLowerCase();
  return S.projects.filter(r => {
    if (q && !r.pretty.toLowerCase().includes(q)) return false;
    if (S.filter === "issues") return r.issues.length > 0;
    if (S.filter === "all") return true;
    return r.expected === S.filter;
  });
}
function renderProjects() {
  const ids = S.profiles.map(p => p.id);
  const chips = [["issues", "Needs attention"], ["all", "All"], ...S.profiles.map(p => [p.id, p.label]), ["shared", "Shared"]];
  const rows = filtered();
  $("#main").innerHTML = `
    <div class="toolbar">
      ${chips.map(([k, l]) => `<button class="chip ${S.filter === k ? "on" : ""}" data-filter="${k}">${esc(l)}</button>`).join("")}
      <input class="search" placeholder="Search a path…" value="${esc(S.q)}" id="q" aria-label="Search projects">
    </div>
    <div class="table">${rows.length ? `<table>
      <thead><tr><th>Project</th><th>Belongs to</th>${S.profiles.map(p => `<th>${esc(p.label)}</th>`).join("")}<th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(r => {
        const pi = r.issues.find(i => i.kind === "profile");
        const main = pi ? { a: "fixmove", l: `Move to ${label(pi.to)}` }
                   : r.issues.find(i => i.kind === "orphan") ? { a: "relink", l: "Relink…" }
                   : r.issues.find(i => i.kind === "unclassified") ? { a: "rule", l: "Assign…" } : null;
        return `<tr>
          <td class="path mono">${esc(r.pretty)}</td>
          <td>${badge(r.expected)}</td>
          ${ids.map(id => { const s = r.in[id]; return `<td class="nums">${s ? `${s.conv} conv · ${s.mem} mem` : "—"}</td>`; }).join("")}
          <td>${r.issues.length ? r.issues.map(i => `<div class="issue ${i.kind === "orphan" ? "err" : ""}">${esc(i.text)}</div>`).join("") : `<span class="okmark">✓ all good</span>`}</td>
          <td class="acts">${main ? `<button class="btn small primary" data-act="${main.a}" data-name="${esc(r.name)}">${esc(main.l)}</button>` : ""}
            <button class="btn small" data-act="manage" data-name="${esc(r.name)}">Manage</button></td></tr>`;
      }).join("")}</tbody></table>` : `<div class="empty">${S.filter === "issues" ? "Nothing needs attention. ✓" : "No projects."}</div>`}
    </div>`;
  $("#q").oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; renderProjects(); const i = $("#q"); i.focus(); i.setSelectionRange(pos, pos); };
}
const byName = n => S.projects.find(r => r.name === n);

const PLAN = { move: to => `moves to ${to}`, merge: to => `is merged into the index of ${to}`, conflict: to => `${to} already has it: the original goes to the backup` };
async function doMove(r, from, to) {
  const s = r.in[from];
  let plan = null;
  try { plan = await api(`/api/projects/move/preview?project=${encodeURIComponent(r.name)}&from=${from}&to=${to}`); } catch {}
  const open = S.profiles.filter(p => (p.id === from || p.id === to) && p.active).map(p => esc(p.label));
  const details = plan ? `<details style="margin-top:10px"><summary>Show the ${plural(plan.items.length, "file or folder", "files and folders")} it touches</summary>
      <ul class="plan">${plan.items.map(i => `<li class="${i.action}" title="${esc(i.from)} → ${esc(i.to)}"><code>${esc(i.item)}</code> ${PLAN[i.action](esc(label(to)))}</li>`).join("")}
        ${plan.prompts ? `<li>${plural(plan.prompts, "prompt", "prompts")} ${plan.prompts === 1 ? "moves" : "move"} from <code>${esc(plan.history)}</code></li>` : ""}
        ${plan.settings ? `<li>The project settings move from <code>${esc(plan.config)}</code></li>` : ""}</ul></details>` : "";
  const warn = open.length ? `<div class="danger-box" style="margin-top:10px">A Claude Code session is open in ${open.join(" and ")}. It keeps <code>.claude.json</code> in memory and could write the old project settings back: close it first, or restart it after moving.</div>` : "";
  if (!(await confirmBox(`Move to ${label(to)}?`,
      `<code>${esc(r.pretty)}</code><br>From ${esc(label(from))} to ${esc(label(to))}: ${plural(s.conv, "conversation", "conversations")}, ${plural(s.mem, "memory", "memories")}, the prompt history and the project settings. Anything ${esc(label(to))} already has goes to the backup.${warn}${details}`, "Move"))) return;
  await run(() => api("/api/projects/move", { project: r.name, from, to })); await refresh();
}
async function doRelink(r, pid) {
  pid = pid || Object.keys(r.in)[0];
  let cands = [];
  try { cands = r.path ? await api("/api/candidates?name=" + encodeURIComponent(basename(r.path))) : []; } catch {}
  const res = await modal({ title: "Relink to a folder", sub: `<code>${esc(r.pretty)}</code> no longer exists. Tell where the project is now: conversations, memories, history and settings will follow${Object.keys(r.in).length > 1 ? ` (profile ${esc(label(pid))})` : ""}.`,
    body: `${cands.length ? `<div class="hint">Folders with the same name:</div>${cands.map(c => `<button class="btn small" data-pick="${esc(c)}" style="text-align:left;white-space:normal"><code>${esc(c)}</code></button>`).join("")}` : `<div class="hint">No folder with the same name was found.</div>`}
      <input class="text" placeholder="~/code/…" value="${esc(cands[0] || "")}" aria-label="New folder">`,
    actions: [{ label: "Relink", kind: "primary", value: "ok" }] });
  if (!res) return;
  const path = $("input.text", res.el)?.value || "";
  await run(() => api("/api/projects/relink", { project: r.name, profile: pid, path })); await refresh();
}
async function doDelete(r, pid) {
  const s = r.in[pid];
  if (!(await confirmBox(`Delete from ${label(pid)}?`, `<code>${esc(r.pretty)}</code><br>${plural(s.conv, "conversation", "conversations")} and ${plural(s.mem, "memory", "memories")} are moved to the backup, not erased.`, "Delete"))) return;
  await run(() => api("/api/projects/delete", { project: r.name, profile: pid })); await refresh();
}
async function doRule(r) {
  const guess = r.path ? r.path.replace(/^~\//, "") : "";
  const res = await modal({ title: "Assign to a profile",
    sub: "Creates a rule: every project whose path contains this text belongs to the chosen profile. New rules win over older ones.",
    body: `<input class="text" value="${esc(guess)}" placeholder="e.g. code/work" aria-label="Path text">
      <select id="rp" aria-label="Profile">${[...S.profiles.map(p => [p.id, p.label]), ["shared", "Shared (all profiles)"]].map(([k, l]) => `<option value="${k}" ${k === r.expected ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`,
    actions: [{ label: "Save rule", kind: "primary", value: "ok" }] });
  if (!res) return;
  await run(() => api("/api/rules", { match: $("input.text", res.el).value, profile: $("#rp", res.el).value })); await refresh();
}
async function doManage(r) {
  const ids = S.profiles.map(p => p.id);
  const opts = [];
  for (const pid of Object.keys(r.in)) {
    const s = r.in[pid];
    for (const to of ids.filter(x => x !== pid)) opts.push({ label: `Move from ${label(pid)} to ${label(to)}`, info: `${s.conv} conv · ${s.mem} mem`, v: ["move", pid, to] });
    if (!r.exists) opts.push({ label: `Relink to a folder (${label(pid)})`, info: "", v: ["relink", pid] });
    opts.push({ label: `Delete from ${label(pid)}`, info: "goes to the backup", v: ["delete", pid], danger: true });
  }
  opts.push({ label: "Assign to a profile (rule)", info: r.expected ? "now: " + label(r.expected) : "unassigned", v: ["rule"] });
  const res = await modal({ title: "Manage project", sub: `<code>${esc(r.pretty)}</code>`,
    body: opts.map((o, i) => `<div class="opt"><span>${esc(o.label)} <span class="hint">${esc(o.info)}</span></span>
      <button class="btn small ${o.danger ? "danger" : ""}" data-i="${i}">Choose</button></div>`).join(""),
    actions: opts.map(o => ({ label: "", value: o.v })) });
  if (!res) return;
  const [a, p1, p2] = res.action;
  if (a === "move") return doMove(r, p1, p2);
  if (a === "relink") return doRelink(r, p1);
  if (a === "delete") return doDelete(r, p1);
  if (a === "rule") return doRule(r);
}

// ---------- memories ----------
async function loadMemProjects() {
  S.mem.projects = await api("/api/memory/projects?profile=" + S.mem.profile);
}
async function openMemProject(name) {
  S.mem.project = name; S.mem.file = null; S.mem.list = null; renderMemories();
  S.mem.list = await api(`/api/memory/list?profile=${S.mem.profile}&project=${encodeURIComponent(name)}`);
  renderMemories();
}
async function openMemFile(f) {
  S.mem.file = f;
  const r = await api(`/api/memory/file?profile=${S.mem.profile}&project=${encodeURIComponent(S.mem.project)}&file=${encodeURIComponent(f)}`);
  S.mem.content = r.content; renderMemories();
}
function renderMemories() {
  const m = S.mem;
  const q = m.q.toLowerCase();
  const plist = m.projects.filter(p => (m.all || p.count > 0) && (!q || p.pretty.toLowerCase().includes(q)));
  const cur = m.projects.find(p => p.name === m.project);
  $("#main").innerHTML = `<div class="memgrid">
    <aside class="side"><div class="head">
      <div class="seg">${S.profiles.map(p => `<button data-mprof="${p.id}" class="${m.profile === p.id ? "on" : ""}">${esc(p.label)}</button>`).join("")}</div>
      <input class="search" style="min-width:0;margin:0" placeholder="Filter projects…" value="${esc(m.q)}" id="mq" aria-label="Filter projects">
      <label class="check"><input type="checkbox" id="mall" ${m.all ? "checked" : ""}> also show projects without memories</label></div>
      <div class="plist">${plist.map(p => `<button data-mproj="${esc(p.name)}" class="${p.name === m.project ? "on" : ""}">
        <span class="p">${esc(p.pretty)}</span><span class="n">${p.count}</span></button>`).join("") || `<div class="empty">No projects.</div>`}</div>
    </aside>
    <section>${!cur ? `<div class="empty">Pick a project on the left.</div>` : `
      <div class="hint" style="margin-bottom:8px"><code>${esc(cur.pretty)}</code> · ${esc(label(m.profile))}</div>
      ${!m.list ? `<div class="empty"><span class="spinner"></span></div>` : `
        ${m.list.missing.length ? `<div class="issue err" style="margin-bottom:8px">MEMORY.md lists files that do not exist: ${m.list.missing.map(esc).join(", ")}</div>` : ""}
        <div class="cards">${m.list.items.map(it => `<div class="mcard ${it.file === m.file ? "on" : ""}" data-mfile="${esc(it.file)}" tabindex="0" role="button">
          <div class="t">${esc(it.name)} ${it.type ? `<span class="badge b-none">${esc(it.type)}</span>` : ""}
            ${it.indexed ? "" : `<span class="badge b-warn">not in MEMORY.md</span>`}</div>
          <div class="d">${esc(it.description)}</div></div>`).join("") || `<div class="empty">No memories in this project.</div>`}</div>
        ${m.file ? `<div class="editor"><div class="hint" style="margin-bottom:6px"><code>${esc(m.file)}</code></div>
          <textarea id="mtext" spellcheck="false" aria-label="Memory content">${esc(m.content)}</textarea>
          <div class="row"><span class="grow">Saving keeps a copy of the previous version.</span>
            <button class="btn danger" id="mdel">Delete</button><button class="btn" id="mmove">Move…</button>
            <button class="btn primary" id="msave">Save</button></div></div>` : ""}`}`}
    </section></div>`;
  $("#mq").oninput = e => { m.q = e.target.value; const pos = e.target.selectionStart; renderMemories(); const i = $("#mq"); i.focus(); i.setSelectionRange(pos, pos); };
  $("#mall").onchange = e => { m.all = e.target.checked; renderMemories(); };
  if ($("#msave")) {
    const ctx = () => ({ profile: m.profile, project: m.project, file: m.file });
    $("#msave").onclick = async () => { await run(() => api("/api/memory/save", { ...ctx(), content: $("#mtext").value })); m.content = $("#mtext").value; };
    $("#mdel").onclick = async () => {

const fmt = v => v === null || v === undefined ? "default" : typeof v === "boolean" ? (v ? "on" : "off") : String(v);

function bindSettings() {
  const st = S.set, d = st.data, pid = st.profile;
  const save = async (key, value) => { try { await run(() => api("/api/settings/field", { profile: pid, key, value })); } catch {} loadSettings(pid); };
  document.querySelectorAll("[data-sfield]").forEach(el => {
    const f = d.fields.find(x => x.key === el.dataset.sfield);
    if (f.type === "bool") { el.onchange = () => save(f.key, el.checked); return; }
    if (f.type === "select") {
      el.onchange = () => {
        const dsc = document.querySelector(`[data-sdesc="${f.key}"]`);
        if (dsc) dsc.textContent = optionDesc(f, el.value);
        save(f.key, el.value === "" ? null : el.value);
      };
      return;
    }
    const btn = document.querySelector(`[data-ssave="${f.key}"]`);
    const val = () => f.type === "number" ? (el.value === "" ? null : parseInt(el.value, 10)) : (el.value.trim() || null);
    el.oninput = () => { btn.hidden = JSON.stringify(val()) === JSON.stringify(f.value ?? null); };
    el.onkeydown = e => { if (e.key === "Enter" && !btn.hidden) btn.click(); };
    btn.onclick = () => save(f.key, val());
  });
  document.querySelectorAll("[data-sreset]").forEach(b => b.onclick = async () => {
    const f = d.fields.find(x => x.key === b.dataset.sreset);
    if (await confirmBox("Back to the default?", `<b>${esc(f.label)}</b> is removed from <code>${f.source === "local" ? "settings.local.json" : "settings.json"}</code>.${f.source === "local" ? " If settings.json also has it, that value applies." : ""}`, "Remove")) save(f.key, null);
  });
  document.querySelectorAll("[data-scopy]").forEach(b => b.onclick = () => {
    const f = d.fields.find(x => x.key === b.dataset.scopy), o = f.others.find(x => x.id === b.dataset.from);
    save(f.key, o.value);
  });
  document.querySelectorAll("[data-setprof]").forEach(b => b.onclick = () => loadSettings(b.dataset.setprof));
  document.querySelectorAll("[data-rawfile]").forEach(b => b.onclick = () => { st.rawFile = b.dataset.rawfile; renderSettings(); });
  $("#cmd-save").onclick = async () => { try { await run(() => api("/api/settings/claude-md", { profile: pid, content: $("#cmd-text").value })); } catch {} loadSettings(pid); };
  $("#perm-save").onclick = async () => {
    const rules = Object.fromEntries(["allow", "ask", "deny"].map(k => [k, $("#perm-" + k).value.split("\n")]));
    try { await run(() => api("/api/settings/permissions", { profile: pid, rules })); } catch {} loadSettings(pid);
  };
  const raw = $("#raw-text"), status = $("#raw-status");
  const check = () => { try { const v = JSON.parse(raw.value); if (typeof v !== "object" || Array.isArray(v) || v === null) throw new Error("must be an object { … }"); status.textContent = "Valid JSON"; status.style.color = "var(--ok)"; return true; }
    catch (e) { status.textContent = e.message; status.style.color = "var(--err)"; return false; } };
  raw.oninput = check; check();
  $("#raw-format").onclick = () => { if (check()) { raw.value = JSON.stringify(JSON.parse(raw.value), null, 2) + "\n"; } };
  $("#raw-save").onclick = async () => { if (!check()) return; try { await run(() => api("/api/settings/raw", { profile: pid, file: st.rawFile, content: raw.value })); } catch {} loadSettings(pid); };
  $("#g-auto").onchange = async e => { try { await run(() => api("/api/settings/global", { profile: pid, key: "autoUpdates", value: e.target.checked })); } catch {} loadSettings(pid); };
}

// ---------- theme ----------
// System follows the operating system; Light and Dark set data-theme on <html>, which the CSS
// variables and the script in <head> read. The choice is kept in localStorage, per browser.
const THEMES = [["system", "System"], ["light", "Light"], ["dark", "Dark"]];
const savedTheme = () => { try { return localStorage.getItem("cc-profiles.theme") || "system"; } catch { return "system"; } };
function setTheme(v) {
  try { localStorage.setItem("cc-profiles.theme", v); } catch {}
  if (v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v);
  else document.documentElement.removeAttribute("data-theme");
}
let closeTheme = null;
function openTheme() {
  const btn = $("#theme-btn"), r = btn.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "popover"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "Theme");
  pop.style.top = (r.bottom + 8) + "px";
  pop.style.right = Math.max(16, document.documentElement.clientWidth - r.right) + "px";
  const draw = () => {
    const cur = savedTheme();
    pop.innerHTML = `<h2>Theme</h2><div class="seg">${THEMES.map(([k, l]) => `<button data-theme-set="${k}" class="${cur === k ? "on" : ""}" aria-pressed="${cur === k}">${l}</button>`).join("")}</div>`;
  };
  const close = () => { pop.remove(); closeTheme = null; document.removeEventListener("keydown", onKey); document.removeEventListener("mousedown", onOut); btn.focus(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  const onOut = e => { if (!pop.contains(e.target) && !btn.contains(e.target)) close(); };
  pop.addEventListener("click", e => { const b = e.target.closest("[data-theme-set]"); if (b) { setTheme(b.dataset.themeSet); draw(); $("button.on", pop)?.focus(); } });
  draw();
  document.body.append(pop);
  document.addEventListener("keydown", onKey); document.addEventListener("mousedown", onOut);
  closeTheme = close;
  $("button.on", pop)?.focus();
}

// ---------- installing Claude Code ----------
async function loadClaudeStatus() {

      <span>It is in <code>${esc(c.path)}</code>. Add this line to your shell startup file (e.g. <code>~/.zshrc</code>) and open a new terminal: <code>export PATH="$HOME/.local/bin:$PATH"</code></span></div></div>`;

async function installClaude() {

  const first = c.methods.find(m => m.available);
  if (!first) return toast("No install method is available on this computer.", "", true);
  const res = await modal({ title: "Install Claude Code",
    sub: `Official commands from the Claude Code documentation. You need an internet connection; after installing, log in with a Pro, Max, Team or Enterprise account.`,
    body: c.methods.map(m => `<label class="method ${m.available ? "" : "off"}">
        <span class="top"><input type="radio" name="im" value="${m.id}" ${m.id === first.id ? "checked" : ""} ${m.available ? "" : "disabled"}> ${esc(m.label)}</span>
        <code>${esc(m.command)}</code>
        <span class="hint">${esc(m.available ? m.note : m.why)}</span></label>`).join(""),
    actions: [{ label: "Install", kind: "primary", value: "ok" }] });
  if (!res) return;
  const method = res.el.querySelector('input[name="im"]:checked').value;

}
async function showInstallLog() {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="width:min(720px,100%)"><h2 id="il-title"><span class="spinner"></span> Installing…</h2>

const size = n => n > 1e9 ? (n / 1e9).toFixed(1) + " GB" : n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : n > 1e3 ? Math.round(n / 1e3) + " KB" : n + " B";
const when = t => new Date(t * 1000).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function renderBackups() {
  if (S.tab !== "backups") return;
  if (!S.backups) { $("#main").innerHTML = `<div class="empty"><span class="spinner"></span></div>`; return; }
  const tot = S.backups.reduce((a, b) => a + b.size, 0);
  const where = S.backups[0]?.path.replace(/\/[^/]+$/, "") || "~/.cc-profiles/backups";
  $("#main").innerHTML = `<div class="toolbar"><span class="hint">${plural(S.backups.length, "backup", "backups")} · ${size(tot)} in <code>${esc(where)}</code>. Restoring undoes the operation and creates a backup of its own.</span>
      ${S.backups.length ? `<button class="btn" id="bk-prune" style="margin-left:auto">Delete old backups…</button>` : ""}</div>
    <div class="table">${S.backups.map(b => `<div class="bk"><div class="txt">
        <div class="t">${esc(b.title)} ${b.restored ? `<span class="badge b-none">restored ${esc(when(b.restored))}</span>` : ""}</div>
        <div class="m">${esc(when(b.created))} · ${plural(b.steps, "step", "steps")} · ${size(b.size)}${b.log.length ? " · " + b.log.map(esc).join(" · ") : ""}</div></div>
      <div class="acts">${b.restorable ? `<button class="btn small primary" data-restore="${esc(b.name)}">Restore</button>` : ""}
        <button class="btn small danger" data-bdel="${esc(b.name)}">Delete</button></div></div>`).join("") || `<div class="empty">No backups yet: one is created for every operation.</div>`}</div>`;
  $("#bk-prune")?.addEventListener("click", pruneBackups);
}
async function pruneBackups() {
  const old = days => S.backups.filter(b => b.created < Date.now() / 1000 - days * 86400);
  const line = days => { const o = old(days); return o.length ? `${plural(o.length, "backup", "backups")}, ${size(o.reduce((a, b) => a + b.size, 0))}` : "none"; };
  const resP = modal({ title: "Delete old backups",
    sub: "Deleted backups cannot be restored afterwards: keep the ones of operations you might still want to undo.",
    body: `<div class="form"><label class="f">Delete the backups older than
        <select id="pr-days">${[7, 30, 90, 365].map(d => `<option value="${d}" ${d === 30 ? "selected" : ""}>${d} days</option>`).join("")}</select></label>
      <div class="hint" id="pr-what"></div></div>`,
    actions: [{ label: "Delete permanently", kind: "danger", value: "ok" }] });
  const sel = $("#pr-days"), what = () => { $("#pr-what").textContent = "To delete: " + line(+sel.value); };
  sel.onchange = what; what();
  const res = await resP;
  if (!res) return;
  await run(() => api("/api/backups/prune", { days: +$("#pr-days", res.el).value })).catch(() => {});
  loadBackups();
}
async function restoreBackup(name) {
  const b = S.backups.find(x => x.name === name);
  const newer = S.backups.filter(x => x.created > b.created && x.restorable && !x.title.startsWith("Before restoring"));
  const warn = newer.length ? `<br><br><span class="issue">${plural(newer.length, "newer operation has", "newer operations have")} not been undone yet (${newer.slice(0, 3).map(x => esc(x.title)).join(" · ")}${newer.length > 3 ? "…" : ""}). If they touched the same files, undo them first, newest first.</span>` : "";
  if (!(await confirmBox("Restore?", `<b>${esc(b.title)}</b><br>Undoes this operation by putting the files back as they were. Later changes to the same files are overwritten (but saved in the restore's own backup).${warn}`, "Restore"))) return;
  const r = await run(() => api("/api/backups/restore", { name })).catch(() => null);
  if (r?.problems?.length) toast("Steps not restored: " + r.problems.slice(0, 3).join(" · "), "", true);
  await refresh(); loadBackups();
}
async function deleteBackup(name) {
  const b = S.backups.find(x => x.name === name);
  if (!(await confirmBox("Delete this backup?", `<b>${esc(b.title)}</b> (${size(b.size)})<br>This is the only action that really erases something: it cannot be restored afterwards.`, "Delete permanently"))) return;
  await run(() => api("/api/backups/delete", { name })).catch(() => {});
  loadBackups();
}

// ---------- events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) {
    S.tab = t.dataset.tab;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === t));
    if (S.tab === "memories" && !S.mem.profile) { S.mem.profile = S.profiles[0]?.id; await loadMemProjects(); }
    if (S.tab === "health" && !S.health) return loadHealth();
    if (S.tab === "profiles") return loadSharing();
    if (EXT_TABS.includes(S.tab)) return loadExt();
    if (S.tab === "settings") return loadSettings(S.set?.profile || S.profiles[0]?.id);
    if (S.tab === "backups") return loadBackups();
    return render();
  }
  if (t.hasAttribute("data-newprofile")) return newProfile();
  if (t.hasAttribute("data-install")) return installClaude();
  if (t.hasAttribute("data-install-log")) return showInstallLog();
  if (t.dataset.pedit) return editProfile(t.dataset.pedit);
  if (t.dataset.pext) { S.tab = t.dataset.ext; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab)); return loadExt(t.dataset.pext); }
  if (t.dataset.extprof) return loadExt(t.dataset.extprof);
  if (t.dataset.pdel) return deleteProfile(t.dataset.pdel);
  if (t.dataset.restore) return restoreBackup(t.dataset.restore);
  if (t.dataset.bdel) return deleteBackup(t.dataset.bdel);
  if (t.dataset.filter) { S.filter = t.dataset.filter; return renderProjects(); }
  if (t.dataset.act) {
    const r = byName(t.dataset.name);
    if (t.dataset.act === "fixmove") { const i = r.issues.find(x => x.kind === "profile"); return doMove(r, i.from, i.to); }
    if (t.dataset.act === "relink") return doRelink(r);
    if (t.dataset.act === "rule") return doRule(r);
    if (t.dataset.act === "manage") return doManage(r);
  }
  if (t.dataset.mprof) { S.mem.profile = t.dataset.mprof; S.mem.project = null; S.mem.file = null; await loadMemProjects(); return renderMemories(); }
  if (t.dataset.mproj) return openMemProject(t.dataset.mproj);
  if (t.dataset.hlink) {
    if (!(await confirmBox("Relink to this folder?", `<code>${esc(t.dataset.path)}</code>`, "Relink"))) return;
    await run(() => api("/api/projects/relink", { project: t.dataset.hlink, profile: t.dataset.prof, path: t.dataset.path }));
    await refresh(); return loadHealth();
  }
  if (t.dataset.hrelink) { await doRelink(byName(t.dataset.hrelink), t.dataset.prof); return S.tab === "health" && loadHealth(); }
  if (t.dataset.hdel) { await doDelete(byName(t.dataset.hdel), t.dataset.prof); return S.tab === "health" && loadHealth(); }
});
const openCard = c => c.dataset.skill ? openSkill(c.dataset.skill) : openMemFile(c.dataset.mfile);
document.addEventListener("click", e => { const c = e.target.closest(".mcard"); if (c) openCard(c); });
document.addEventListener("keydown", e => { const c = e.target.closest?.(".mcard"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCard(c); } });

function render() {
  if (S.tab === "projects") renderProjects();
  else if (S.tab === "memories") renderMemories();
  else if (S.tab === "settings") renderSettings();
  else if (S.tab === "profiles") renderSharing();
  else if (EXT_TABS.includes(S.tab)) renderExt();
  else if (S.tab === "backups") renderBackups();
  else renderHealth();
}
$("#about-btn").onclick = openAbout;
$("#theme-btn").onclick = () => (closeTheme ? closeTheme() : openTheme());
loadClaudeStatus();
refresh().catch(e => { $("#main").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
