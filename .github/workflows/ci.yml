name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12') }}
        run: python -m pytest -v
      # One version also measures coverage, including the servers the tests start
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: python -m coverage run -m pytest -v
      - name: Coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m coverage combine
          python -m coverage report --sort=cover
          {
            echo "### Test coverage (Python ${{ matrix.python }}, servers included)"
            echo
            python -m coverage report --sort=cover --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          # the floor: a little below the total reached (93.7%), so coverage cannot drop unnoticed
          python -m coverage report --fail-under=92 > /dev/null || {
            echo "::error::Test coverage fell below 92%: add tests for the new code (see CONTRIBUTING.md, Coverage)"
            exit 1
          }

  ui:
    name: UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[ui]"
          python -m playwright install --with-deps chromium
      - name: Open every tab in Chromium
        run: python -m pytest -v tests/test_ui.py

  install-script:
    name: install.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install into a sandbox home
        run: |
          python -m pip install pipx
          # runners point pipx to /opt: install into the sandbox home, as for a user
          unset PIPX_HOME PIPX_BIN_DIR
          SB="$(mktemp -d)"
          mkdir -p "$SB/.claude" "$SB/.claude-work"
          echo '{}' > "$SB/.claude/settings.json"
          echo '{}' > "$SB/.claude-work/settings.json"
          HOME="$SB" CC_PROFILES_SOURCE="$PWD" sh install.sh
          HOME="$SB" sh install.sh --help > /dev/null
          test -x "$SB/.local/bin/cc-profiles"
          grep -q "managed by cc-profiles" "$SB/.claude/commands/cc-profiles.md"
          grep -q "managed by cc-profiles" "$SB/.claude-work/commands/cc-profiles.md"

  package:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No undefined names (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes $(ls src/cc_profiles/*.py | grep -v server.py)
      - name: Type-check the UI's JavaScript
        run: python scripts/check_js.py
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel contains the UI
        run: python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'cc_profiles/static/index.html' in names, names"
