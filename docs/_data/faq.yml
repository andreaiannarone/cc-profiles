# Questions and answers of docs/faq.md, also published as FAQPage structured data.
# Keep them identical to the page (tests/test_tooling.py checks the questions).
- q: How do I use several Claude Code accounts on one computer?
  a: Each account lives in its own Claude Code configuration folder, such as ~/.claude and ~/.claude-work, selected with the CLAUDE_CONFIG_DIR environment variable. cc-profiles finds these profiles, creates new ones with a claude-<name> command to start them, and shows which account each one is signed in with.
- q: How do I start Claude Code in a different profile for each project?
  a: Add folder rules in the Projects tab (for example code/work goes to the Work profile) and turn on Profile by folder in the Profiles tab. From then on, typing claude in a terminal starts Claude Code in the profile of the folder you are in.
- q: How do I move a project from one Claude Code profile to another?
  a: In the Projects tab, pick Move on the project. cc-profiles moves its conversations, memories, file snapshots, prompt history and per-project settings, shows every file it touches first, and keeps a backup you can restore.
- q: Does cc-profiles copy my login or API keys between profiles?
  a: No. Login credentials (.credentials.json and the account stored in .claude.json) are never copied, shared, exported or put into templates, because a copied token can stop working when the original profile refreshes it.
- q: Is it safe to use cc-profiles while Claude Code is running?
  a: Yes. Every file is written atomically, so Claude Code never reads half a file, every change is backed up first, and cc-profiles warns when a session is open in a profile it is about to change. Open sessions pick up most changes when they restart.
- q: Can I undo a change made with cc-profiles?
  a: Yes. Every operation creates a backup with a journal of its steps. Restore in the Backups tab undoes it, Show changes lists what it changed, and Keep protects a backup from the automatic cleanup.
- q: Can profiles share skills, plugins or settings?
  a: Yes. A profile can share skills, plugins, agents, commands, CLAUDE.md or settings.json with the source profile through a symbolic link, so you install or edit them once and every sharing profile sees the change.
- q: How can I see how many tokens each Claude Code profile uses?
  a: The Usage tab adds up the token usage Claude Code records on every reply, per day, project, model and profile, with an estimated cost at list price and a CSV export.
- q: Does cc-profiles send my data anywhere?
  a: No. It runs on your computer and listens on 127.0.0.1 only, with a token on every request. It contacts the internet only when you click to check for updates or to install Claude Code.
- q: Which systems does cc-profiles run on, and what does it cost?
  a: macOS and Linux, with Python 3.9 or later and no other dependencies. It is free and open source under the GNU GPL v3.0 or later.
